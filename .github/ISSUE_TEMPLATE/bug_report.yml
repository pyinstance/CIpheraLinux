name: Bug report
description: Report a reproducible CIphera bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach vault files, passwords, tokens, keyfiles, recovery codes or other secrets.
        Security vulnerabilities should follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: CIphera version
      placeholder: "v1.3.0 / commit hash"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Linux distribution / environment
      placeholder: "Arch Linux, Hyprland, Wayland"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
