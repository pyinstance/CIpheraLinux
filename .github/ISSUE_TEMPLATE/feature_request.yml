name: Feature request
description: Suggest an improvement for CIphera
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Does this touch security-sensitive code?
      options:
        - "No"
        - "Yes / Unsure"
    validations:
      required: true
