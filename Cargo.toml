[package]
name = "ciphera"
version = "1.3.0"
edition = "2021"
description = "Local-first encrypted CLI password manager for Linux"
license = "MIT"
readme = "README.md"
keywords = ["password-manager", "security", "cli", "linux", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
dialoguer = "0.11"
dirs = "6"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
